name: Tests and video source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: promo-video/package-lock.json
      - run: npm ci
        working-directory: promo-video
      - run: npm run fixtures && npm run check
        working-directory: promo-video
      - name: Ensure generated fixtures are current
        run: git diff --exit-code -- promo-video/src/demo.json
